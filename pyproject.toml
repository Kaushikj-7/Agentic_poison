[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-poi"
version = "0.1.0"
description = "AgentPOI-SDE: fail-closed Repository Invariant Verification (RIV) for autonomous software-engineering agents, plus the original CIV/DSEC financial defense framework"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Kaushik", email = "kaushikj2005@gmail.com"},
]
dependencies = [
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "requests>=2.31",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "pdfplumber>=0.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "hypothesis>=6.80.0",
    "ruff>=0.1.0",
]
ui = [
    "streamlit>=1.30",
    "pandas>=2.0",
    "matplotlib>=3.7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.setuptools.packages.find]
include = ["agent_poi*", "agentpoi_sde*"]

[tool.setuptools.package-data]
agent_poi = ["*.yaml", "config.yaml"]
agentpoi_sde = ["*.yaml"]

