# Contextual Trust Propagation (CTP) Framework Configuration
version: "1.0.0"

# Contextual Integrity & Trust Decay Parameters
trust_model:
  lambda_decay: 2.5                 # Exponential penalty factor for CI risk
  tau_threshold: 0.50               # Default decision threshold (calibrated via Pareto sweep)
  tau_critical: 0.25                # Below this threshold, memory is strictly BLOCKED (not quarantined)
  
  # Base Trust Priors by Origin T_source(c)
  source_priors:
    verified_user: 0.95
    system_instruction: 0.90
    internal_tool: 0.65
    external_api: 0.40
    untrusted_web: 0.25
    anonymous_peer: 0.15

  # CI Parameter Risk Weights w_i (summing to 1.0)
  risk_weights:
    self_asserted_auth: 0.45        # Asserting own transmission principle (e.g. 'pre-approved', 'override')
    imperative_density: 0.25        # High concentration of directive command verbs
    type_mismatch: 0.20             # Data object containing execution control flow instructions
    suspicious_framing: 0.10        # Adversarial delimiters, roleplay masks, context resets

# Retrieval-Time Alignment Gate (Task Shield Proxy)
retrieval_gate:
  enabled: true
  min_task_similarity: 0.35         # Minimum cosine alignment with active task
  max_divergence_penalty: 0.30      # Penalty applied when memory introduces unsolicited action directives

# Runtime & Execution
runtime:
  mode: "mock"                      # "mock" (100% zero-cost CPU) or "ollama"
  ollama:
    base_url: "http://localhost:11434"
    model: "llama3.2:3b"
    timeout_seconds: 30

# Memory Storage
storage:
  vector_db_type: "fallback"        # "chroma" or "fallback" (in-memory scikit-learn cosine similarity)
  persist_directory: "data/memory_store"
  embedding_dimension: 384

# Autonomous Financial Agent Domain Parameters
financial_domain:
  per_transaction_limit: 25000.0
  daily_limit: 100000.0
  relevance_threshold: 0.0
  max_divergence_risk: 0.35
