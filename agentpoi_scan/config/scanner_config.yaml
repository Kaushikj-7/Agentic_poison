scanners:
  - python_sast
  - unicode_trojan
  - repo_injection
  - autorun_surface
  - legacy_patterns
  - taint_flow
  - dependency_hygiene
  - semgrep
  - gitleaks
  - osv
tiers:
  local:
    provider: openrouter
    model: nvidia/nemotron-3.5-lightning:free
  frontier:
    provider: openrouter
    # Free-tier open-weight model (matches OPENROUTER_MODEL in the local .env).
    # The key arrives from OPENROUTER_API_KEY in .env / env — never hardcoded.
    # The paid-model escalation can be re-enabled by setting model to a
    # non-:free id (request cascade still falls back to :free models on 4xx).
    model: google/gemma-4-31b-it:free
  verifier:
    provider: openrouter
    model: qwen/qwen-2.5-coder-32b-instruct:free
limits:
  # Free-tier OpenRouter guardrails (enforced locally, fail-closed in
  # agentpoi_scan.agents.llm_bridge.RateLimitedProvider): a :free model allows
  # ~20 req/min and a small daily quota, so stay well inside both.
  requests_per_minute: 15
  max_requests_per_scan: 45
  max_backoff_seconds: 60.0
  tier_caps:
    local: 20
    frontier: 15
    verifier: 10
router:
  escalate_if:
    severity_gte: high
    local_confidence_lt: 0.7
    on_autorun_surface: true
    malware_score_gte: 0.6
  budget_usd_per_repo: 2.0
fetch:
  max_files: 20000
  max_total_mb: 500
  max_depth: 20
privacy:
  local_only: false
  redact_secrets: true
